name: Release

# Run from the Actions tab. Each run reads the latest vX.Y.Z tag, bumps it, builds a
# signed release APK, and publishes a GitHub release with that tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increase
        type: choice
        options: [minor, patch, major]
        default: minor
      prerelease:
        description: Mark the release as a pre-release (release candidate)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          name="$major.$minor.$patch"
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "Previous: $latest, next: v$name (versionCode $code)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PRINTYLAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "PRINTYLAN_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release key" >> "$GITHUB_ENV"
          else
            echo "::warning::PRINTYLAN_KEYSTORE_BASE64 is not set. The APK is signed with a throwaway debug key."
            echo "SIGNED_WITH=debug key" >> "$GITHUB_ENV"
          fi

      - name: Test and build release APK
        env:
          PRINTYLAN_KEYSTORE_PASSWORD: ${{ secrets.PRINTYLAN_KEYSTORE_PASSWORD }}
          PRINTYLAN_KEY_ALIAS: ${{ secrets.PRINTYLAN_KEY_ALIAS }}
          PRINTYLAN_KEY_PASSWORD: ${{ secrets.PRINTYLAN_KEY_PASSWORD }}
        run: >
          ./gradlew :core:model:test :core:driver:test :app:assembleRelease
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p dist
          apk="dist/printylan-v${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          notes="Signed with the $SIGNED_WITH. Requires Android 8.0 or newer with USB host support."
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Printylan $TAG" \
            --notes "$notes" \
            --generate-notes \
            "${flags[@]}"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: printylan-v${{ steps.version.outputs.name }}
          path: dist/
